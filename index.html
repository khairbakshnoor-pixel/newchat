<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G. Batista Engineering & Construction — Chat</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <script
    id="retell-widget"
    src="https://dashboard.retellai.com/retell-widget-v2.js"
    type="module"
    data-public-key="public_key_c7d00c4b77230120c528a"
    data-agent-id="agent_e2202fe277ace5ed5adb2c1c6b"
    data-title="Chat with Alex"
    data-bot-name="Alex"
    data-logo-url="./image.png"
    data-popup-message="Hi! Need help with your building? Chat with Alex."
    data-show-ai-popup="true"
    data-show-ai-popup-time="4"
    data-auto-open="false"
    data-theme-color="#0b3d59"
    data-color="#0b3d59"
  ></script>

  <script>
    (() => {
      const styleWidget = () => {
        const shadowRoot = [...document.querySelectorAll('*')]
          .map((element) => element.shadowRoot)
          .find((root) => root?.querySelector('img[alt="Support"], img[alt="Alex"], a[href*="retellai.com"]'));
        if (!shadowRoot) return false;
        if (shadowRoot.getElementById('gb-widget-style')) return true;

        const launcherLogo = shadowRoot.querySelector('img[alt="Support"]');
        if (launcherLogo) launcherLogo.src = new URL('./image.png', document.baseURI).href;

        const style = document.createElement('style');
        style.id = 'gb-widget-style';
        style.textContent = `
          /* Keep the open widget comfortably below the viewport edge. */
          :host {
            transform: translateY(38px) !important;
          }

          /* Floating launcher with support label */
          button:has(img[alt="Support"]) {
            width: auto !important;
            min-width: 188px !important;
            height: 60px !important;
            padding: 3px 16px 3px 3px !important;
            border-radius: 999px !important;
            background: #0b3d59 !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 9px 22px rgba(11, 61, 89, 0.3), 0 2px 6px rgba(0, 0, 0, 0.13) !important;
            color: #ffffff !important;
            font-size: 14px !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
          }
          button:has(img[alt="Support"]):hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 13px 27px rgba(11, 61, 89, 0.34), 0 3px 7px rgba(0, 0, 0, 0.14) !important;
          }

          /* Launcher button (closed bubble) */
          img[alt="Support"],
          img[alt="Chat with Alex"],
          img[alt="Alex"] {
            width: 60px !important;
            height: 60px !important;
            object-fit: contain !important;
            border-radius: 50% !important;
            padding: 3px !important;
            background: #ffffff !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14) !important;
            box-sizing: border-box !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
            cursor: pointer !important;
          }
          img[alt="Support"]:hover,
          img[alt="Chat with Alex"]:hover,
          img[alt="Alex"]:hover {
            transform: scale(1.08) !important;
            box-shadow: 0 8px 26px rgba(11, 61, 89, 0.45), 0 3px 8px rgba(0, 0, 0, 0.2) !important;
          }

          /* Header logo inside the open chat window */
          img[alt="Alex"] {
            width: 50px !important;
            height: 50px !important;
            object-fit: contain !important;
            object-position: center !important;
            border-radius: 8px !important;
            padding: 0 !important;
            background: #ffffff !important;
            border: 1px solid rgba(11, 61, 89, 0.12) !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14) !important;
            box-sizing: border-box !important;
          }

          /* Hide Retell branding link */
          a[href*="retellai.com"] {
            display: none !important;
          }
          a[href*="retellai.com"]::before {
            display: none !important;
          }
          div:has(> a[href*="retellai.com"]) {
            display: none !important;
          }
        `;
        shadowRoot.appendChild(style);
        shadowRoot.querySelector('a[href*="retellai.com"]')?.parentElement.style.setProperty('display', 'none', 'important');
        return true;
      };

      const widgetInterval = setInterval(() => {
        if (styleWidget()) clearInterval(widgetInterval);
      }, 100);
    })();
  </script>
</body>
</html>
